<!DOCTYPE html>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Barre de chargement rose pâle avec Peggy qui court (John 12/11) ; la vraie <progress> reste, invisible, et la nourrit */
#status-progress { opacity: 0; pointer-events: none; }
#vq-charge { position: absolute; left: 50%; bottom: 14%; width: min(78vw, 420px); transform: translateX(-50%); display: none; }
#vq-charge-piste { position: relative; height: 26px; border-radius: 15px; background: #ffe3ec; border: 3px solid #3b2416; box-shadow: 0 4px 0 rgba(0,0,0,.45); overflow: hidden; }
#vq-charge-plein { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 12px; background: linear-gradient(#ffc2d6, #f78fb3); transition: width .25s linear; }
#vq-peggy { position: absolute; z-index: 2; bottom: 27px; left: 0%; width: 86px; height: 67px; margin-left: -70px; background: url(peggy-course.webp) 0 0 / 1032px 67px no-repeat; animation: vq-peggy-court 1s steps(12) infinite; transition: left .25s linear; }
@keyframes vq-peggy-court { to { background-position: -1032px 0; } }
#vq-charge-texte { margin-top: 10px; text-align: center; color: #ffe3ec; font: 600 15px/1 sans-serif; letter-spacing: .5px; }

		<div id="status">
			<img id="status-splash" style="display:none" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="vq-charge"><div style="position:relative"><div id="vq-charge-piste"><div id="vq-charge-plein"></div></div><div id="vq-peggy"></div></div><div id="vq-charge-texte">Chargement…</div></div>
			<script>
			(function () {
				var p = document.getElementById('status-progress'), boite = document.getElementById('vq-charge');
				var plein = document.getElementById('vq-charge-plein'), peggy = document.getElementById('vq-peggy'); var texte = document.getElementById('vq-charge-texte');
				var vu = 0, t = setInterval(function () {
					if (!document.body.contains(p)) { clearInterval(t); return; }
					boite.style.display = p.style.display === 'block' ? 'block' : 'none';
					var v = p.hasAttribute('value') && p.max ? p.value / p.max : vu + (0.9 - vu) * 0.01;
					vu = Math.max(vu, Math.min(1, v));
					var pc = (vu * 100).toFixed(1) + '%';
					plein.style.width = pc; peggy.style.left = pc;
					texte.textContent = 'Chargement… ' + Math.floor(vu * 100) + ' %';
				}, 100);
			})();
			</script>
			<div id="status-notice"></div>
			<div id="vq-version" style="position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.55);font:13px/1 sans-serif;pointer-events:none"></div>
		</div>

		<script>
  // Diagnostic (09/11, temporaire) : les erreurs et les étapes du démarrage s'affichent en bas de l'écran.
  // Seulement pendant le démarrage : une fois le jeu lancé, plus rien ne s'affiche (bug signalé par John 12/11).
  (function () {
    const lignes = [];
    let erreur = false;
    let fini = false;
    function noter(t) {
      if (fini) return;
      if (/^moteur démarré/.test(String(t))) {
        setTimeout(() => { fini = true; const d = document.getElementById('vq-diag'); if (d) d.remove(); }, 8000);
      }
      if (/^(ERR|JS|PROMESSE|erreur)/.test(String(t))) erreur = true;
      lignes.push(String(t).slice(0, 160)); if (lignes.length > 8) lignes.shift();
      if (!erreur) return; // n'apparaît qu'en cas d'erreur
      let d = document.getElementById('vq-diag');
      if (!d) { d = document.createElement('pre'); d.id = 'vq-diag';
        d.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:99;margin:0;padding:6px;background:rgba(0,0,0,.75);color:#ffb3a7;font:11px/1.3 monospace;white-space:pre-wrap;pointer-events:none';
        (document.body || document.documentElement).appendChild(d); }
      d.textContent = lignes.join('\n');
    }
    window.vqNoter = noter;
    const ce = console.error.bind(console);
    console.error = function (...a) { noter('ERR ' + a.join(' ')); ce(...a); };
    window.addEventListener('error', (e) => noter('JS ' + e.message + ' ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => noter('PROMESSE ' + (e.reason && (e.reason.message || e.reason))));
    let mem = '';
    try { if (navigator.deviceMemory) mem = ' mem ' + navigator.deviceMemory + ' Go'; } catch (e) {}
    setTimeout(() => noter('page v09-11-0840 flux' + mem), 50);
  })();
  // Numéro de version (Alpha 0.1.x…) : monté tout seul par maj_web_appli.sh à chaque publication.
  // Au lancement, on demande au site le dernier numéro ; si ce téléphone a une page plus ancienne, on recharge la nouvelle (une fois).
  const VERSION_APPLI = "Bêta 0.1.12";
  window.VQ_VERSION = VERSION_APPLI;
  (function () {
    const e = document.getElementById('vq-version'); if (e) e.textContent = VERSION_APPLI;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).then((d) => {
      if (!d || !d.version || d.version === VERSION_APPLI) return;
      let deja = '';
      try { deja = sessionStorage.getItem('vq-maj') || ''; sessionStorage.setItem('vq-maj', d.version); } catch (x) {}
      if (deja === d.version) return; // déjà essayé : on ne boucle pas
      if (window.vqNoter) vqNoter('nouvelle version ' + d.version + ' (page ' + VERSION_APPLI + ')');
      const u = new URL(location.href); u.searchParams.set('v', d.version.replace(/\s+/g, '-'));
      location.replace(u.toString());
    }).catch(() => {});
  })();
  // Mémoire du jeu (parties, code ami) : on demande au téléphone de la garder pour de bon (fil Bugs 12/11 :
  // l'iPhone de John a tout vidé après une mise à jour). Le résultat est lu par le diagnostic de MES POTES.
  window.vqMemoire = '?';
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then((ok) => { window.vqMemoire = ok ? 'gardée' : 'non garantie'; }).catch(() => { window.vqMemoire = 'erreur'; });
    } else { window.vqMemoire = 'pas dispo'; }
  } catch (e) { window.vqMemoire = 'erreur'; }
  // Plus de service worker (il gardait d'anciennes versions sur l'iPhone) : on retire ceux qui restent.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(async (regs) => {
      for (const r of regs) await r.unregister();
      try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
    }).catch(() => {});
  }
  // Le paquet du jeu est publié en morceaux (limite de 100 Mo par fichier sur GitHub) : on les recolle ici.
  const MORCEAUX_PCK = ["index.pck.b66825769.part0","index.pck.b66825769.part1","index.pck.b66825769.part2","index.pck.b66825769.part3","index.pck.b66825769.part4","index.pck.b66825769.part5","index.pck.b66825769.part6","index.pck.b66825769.part7"];
  const TAILLE_PCK = 301119816; // remplacé à chaque publication
  const fetchOrigine = window.fetch.bind(window);
  // Si un morceau manque (ancienne page gardée en mémoire par l'iPhone), on vide la mémoire de l'appli et on recharge, une fois.
  async function reparer() {
    try { if (sessionStorage.getItem('vq-repare')) return; sessionStorage.setItem('vq-repare', '1'); } catch (e) {}
    try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
    try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
    location.reload();
  }
  window.fetch = async function (entree, options) {
    const url = typeof entree === 'string' ? entree : (entree && entree.url) || '';
    if (url.split('/').pop().split('?')[0] !== 'index.pck') return fetchOrigine(entree, options);
    const barre = document.getElementById('status-progress');
    // Les morceaux sont passés au jeu au fil de l'eau (un flux), sans être recollés en un gros fichier :
    // l'iPhone n'arrive pas à relire un fichier recollé de 138 Mo (« The I/O read operation failed »).
    let n = 0, lecteur = null, recu = 0;
    const flux = new ReadableStream({
      async pull(ctrl) {
        try {
          for (;;) {
            if (!lecteur) {
              if (n >= MORCEAUX_PCK.length) { if (window.vqNoter) vqNoter('pck reçu ' + Math.round(recu / 1e6) + ' Mo'); ctrl.close(); return; }
              const r = await fetchOrigine(MORCEAUX_PCK[n++]);
              if (!r.ok) throw new Error('morceau ' + MORCEAUX_PCK[n - 1]);
              lecteur = r.body.getReader();
            }
            const { done, value } = await lecteur.read();
            if (done) { lecteur = null; continue; }
            recu += value.length;
            if (barre && TAILLE_PCK) { barre.max = 1; barre.value = Math.min(1, recu / TAILLE_PCK); }
            ctrl.enqueue(value);
            return;
          }
        } catch (e) {
          if (window.vqNoter) vqNoter('erreur morceau ' + (e && e.message));
          ctrl.error(e);
          if (String(e && e.message).startsWith('morceau')) reparer();
        }
      }
    });
    return new Response(flux, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
  };
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":301119816,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			if (window.vqNoter) vqNoter('moteur démarré');
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
